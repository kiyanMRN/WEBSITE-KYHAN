<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASA WEBSITE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Browser akan mencoba autoplay dengan suara terlebih dahulu -->
  <video
    id="backgroundVideo"
    class="background-video"
    autoplay
    loop
    playsinline
    preload="auto"
    aria-hidden="true"
  >
    <source src="background.mp4" type="video/mp4" />
  </video>

  <div class="background-overlay" aria-hidden="true"></div>

  <main class="container">
    <header class="profile">
      <img src="profile.jpg" alt="Foto profil Kyhan" />
      <h1>WASA WEBSITE</h1>
      <p>Temukan dan hubungi saya di sini ✨</p>
    </header>

    <nav class="links" aria-label="Media sosial Kyhan">
      <a
        href="https://www.instagram.com/story.imboshu?igsh=a2xpZDh3eXVsMGR5"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          <span>Instagram</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="https://tiktok.com/@storyimboshuyhan48"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
          <span>TikTok</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="https://wa.me/qr/ND4RTPQK2KEBJ1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
          <span>WhatsApp</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="https://t.me/USERNAME_TELEGRAM"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-telegram" aria-hidden="true"></i>
          <span>Telegram</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="https://www.facebook.com/USERNAME_FACEBOOK"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
          <span>Facebook</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        href="https://m.me/USERNAME_FACEBOOK"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-content">
          <i class="fa-brands fa-facebook-messenger" aria-hidden="true"></i>
          <span>Messenger</span>
        </span>
        <span class="link-arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <button id="soundButton" class="sound-button" type="button" hidden>
      <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
      Nyalakan Suara Video
    </button>

    <footer class="footer">
      <p>i love aii 💜</p>
    </footer>
  </main>

  <script>
    const video = document.getElementById("backgroundVideo");
    const soundButton = document.getElementById("soundButton");

    async function startVideo() {
      try {
        // Coba putar otomatis dengan suara.
        video.muted = false;
        await video.play();
        soundButton.hidden = true;
      } catch (error) {
        // Jika diblokir browser, coba putar otomatis tanpa suara.
        video.muted = true;
        soundButton.hidden = false;

        try {
          await video.play();
        } catch (mutedError) {
          // Beberapa browser tetap meminta interaksi pengguna.
          soundButton.innerHTML =
            '<i class="fa-solid fa-play" aria-hidden="true"></i> Putar Video & Suara';
        }
      }
    }

    soundButton.addEventListener("click", async () => {
      try {
        video.muted = false;
        await video.play();
        soundButton.hidden = true;
      } catch (error) {
        video.muted = true;
        soundButton.hidden = false;
      }
    });

    startVideo();
  </script>
</body>
</html>
